# ReXGlue v0.10.0 codegen manifest - Ocho Kart Recomp
#
# Layout expected by v0.10.0 (src/codegen/manifest.cpp + config.cpp):
#   [project]            required: name, optional sdk_version, game_root
#   [entrypoint]         required: file_path, out_directory_path
#   [entrypoint.functions]  manual function boundaries (see below)
#
# BEFORE RUNNING: set game_root and file_path to your own legal dump.
#   run-codegen.ps1 -DumpPath "C:/path/to/your/EL CHAVO KART"  overrides them.
#
# v0.10.0 ignores a top-level [functions] table; it must be [entrypoint.functions].

[project]
name = "ocho_kart"
sdk_version = "0.10.0"
game_root = "REPLACE_WITH_YOUR_DUMP_ROOT"

[entrypoint]
file_path = "REPLACE_WITH_YOUR_DUMP_ROOT/default.xex"
out_directory_path = "generated"
includes = []


0x83243268 = { name = "sub_83243268_thunk", size = 12 }
0x82928C08 = { name = "sub_82928C08_method", size = 20 }
0x82B186B8 = { name = "sub_82B186B8_thunk", size = 24 }

# short return / stub sequences
0x82FB2774 = { name = "stub_82FB2774_ret0", size = 8 }
0x82FB277C = { name = "stub_82FB277C_fcopy", size = 12 }

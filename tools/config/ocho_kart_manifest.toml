# ReXGlue v0.10.0 codegen manifest - Ocho Kart Recomp
#
# Layout expected by v0.10.0 (src/codegen/manifest.cpp + config.cpp):
#   [project]            required: name, optional sdk_version, game_root
#   [entrypoint]         required: file_path, out_directory_path
#   [entrypoint.functions]  manual function boundaries (see below)
#
# BEFORE RUNNING: set game_root and file_path to your own legal dump.
#   run-codegen.ps1 -DumpPath "C:/path/to/your/EL CHAVO KART"  overrides them.
#
# v0.10.0 ignores a top-level [functions] table; it must be [entrypoint.functions].

[project]
name = "ocho_kart"
sdk_version = "0.10.0"
game_root = "REPLACE_WITH_YOUR_DUMP_ROOT"

[entrypoint]
file_path = "REPLACE_WITH_YOUR_DUMP_ROOT/default.xex"
out_directory_path = "generated"
includes = []

# setjmp/longjmp: redirected to native implementations by the recompiler.
# A recompiled longjmp cannot restore the host stack, so without these the
# title's setjmp users (7 call sites; longjmp: 18 direct calls, 21 sites in the
# generated code counting tail branches) break on the first longjmp.
# Found 2026-10-06 in the decrypted image (default.xex SHA1 EB3B307A...):
#   longjmp 0x830BDC90: restores f14-f31 from 0x00(r3), r13-r31 from 0x98(r3),
#     v64-v127 from 0x140(r3), LR 0x134, r1 0x90, CR 0x130; the far path
#     calls RtlUnwind (only direct RtlUnwind caller besides the SEH helper).
#   setjmp  0x830BDFB0: mirror store sequence (no .pdata entry, leaf; sits
#     right after longjmp as in other MSVC/360 CRTs).
longjmp_address = 0x830BDC90
setjmp_address = 0x830BDFB0

# Non-import call targets seen by ReXGlue (vtable thunks / stubs in .text).
# Real imports (307, IAT 0x82000600-0x82000ACC) are resolved by the ExportResolver,
# not here. Full table: docs/toolchain/xex-imports-signed.md.

# vtable thunks: lwz r11,0(r3); lwz r11,off(r11); mtctr r11; bctr  (16 B)
# NOTE: entry is the THUNK START (the lwz), not the trailing bctr.
[entrypoint.functions]
0x82FBFBC0 = { name = "vtable_thunk_82FBFBC0", size = 16 }
# Was "size = 4": the generated function stopped after the first lwz and returned
# with r3 still = the visitor object, so FMOD's FEV loader (EventSystemI::load ->
# 0x82FAE710 -> 0x82FBF9A0 -> 0x82FCCD78 -> here) got a pointer back as its
# FMOD_RESULT, the project handle stayed null and no sound bank was ever opened.
# (The bogus 0x82FBFC2C entry started mid-thunk; the real thunk at 0x82FBFC28 is
# found by the analyzer.)
0x82FBFC38 = { name = "vtable_thunk_82FBFC38", size = 16 }
0x82FBFCE8 = { name = "vtable_thunk_82FBFCE8", size = 16 }
0x82FBFCF8 = { name = "vtable_thunk_82FBFCF8", size = 16 }
0x82FBFD08 = { name = "vtable_thunk_82FBFD08", size = 16 }
0x82FBFD18 = { name = "vtable_thunk_82FBFD18", size = 16 }
0x82FBFD28 = { name = "vtable_thunk_82FBFD28", size = 16 }

# real function body containing the loop at 0x82FBFC9C (target of bne 0x82FBFCB8)
0x82FBFC50 = { name = "func_82FBFC50_loop", end = 0x82FBFCD4 }

# functions reached only via pointers/vtables that codegen did not discover
# (hit at runtime: "Call to invalid or unregistered function").
# Vtable region ~0x82B8AA00: adjustor thunks (addi r3,r3,-4; b) + methods.
0x82BAEEB8 = { name = "sub_82BAEEB8_getter18", size = 8 }
0x82B8AA00 = { name = "sub_82B8AA00_thunk", size = 8 }
0x82B8AA10 = { name = "sub_82B8AA10_thunk", size = 8 }
0x82B8AA18 = { name = "sub_82B8AA18_thunk", size = 8 }
0x82B8AA20 = { name = "sub_82B8AA20_method", size = 248 }
0x82405808 = { name = "sub_82405808_method", size = 24 }
0x830F6C58 = { name = "sub_830F6C58_method", size = 352 }
0x832431B0 = { name = "sub_832431B0_method", size = 100 }
0x83243268 = { name = "sub_83243268_thunk", size = 12 }
0x82928C08 = { name = "sub_82928C08_method", size = 20 }
0x82B186B8 = { name = "sub_82B186B8_thunk", size = 24 }

# DPC routine of the D3D static library (registered by KeInitializeDpc at
# 0x82B639BC, queued by KeInsertQueueDpc at 0x82B577A0). It has no .pdata entry
# and is reached only through the DPC object, so codegen never discovers it.
# Body: store arg1 in the ring at ctx+0x5C, ++count at ctx+0x54, tail-call
# KeSetEvent(ctx+0x3C). Its waiter (sub_82B63670) uses a 30 ms timeout, so
# without the DPC the D3D worker only runs on the timeout path.
0x82B63818 = { name = "d3d_dpc_82B63818_signal", size = 56 }

# short return / stub sequences
0x82FB2774 = { name = "stub_82FB2774_ret0", size = 8 }

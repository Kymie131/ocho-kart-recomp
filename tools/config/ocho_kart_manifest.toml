# ReXGlue v0.10.0 codegen manifest - Ocho Kart Recomp
#
# v0.10.0 layout (src/codegen/manifest.cpp + config.cpp):
#   [project]            required: name, optional sdk_version, game_root
#   [entrypoint]         required: file_path, out_directory_path, and ANY
#                        RecompilerConfig fields including [entrypoint.functions]
#   [[modules]]          optional DLL modules
#
# CRITICAL: [functions] MUST be nested as [entrypoint.functions].
# A top-level [functions] is a sibling table and is NEVER seen by
# RecompilerConfig::LoadFromTable (which is called on the entrypoint table only).
#
# Reclassified call targets: vtable thunks / stubs in .text, not kernel imports.
# Real imports: IAT 0x82000600-0x82000ACC, signed 307/307 in
# docs/toolchain/xex-imports-signed.md.

[project]
name = "ocho_kart"
sdk_version = "0.10.0"
game_root = "C:/Users/israe/OneDrive/Documentos/REPOS/Proyecto_descompilacion/EL CHAVO KART"

[entrypoint]
file_path = "C:/Users/israe/OneDrive/Documentos/REPOS/Proyecto_descompilacion/EL CHAVO KART/default.xex"
out_directory_path = "generated"
includes = []

# vtable thunks: lwz r11,0(r3); lwz r11,off(r11); mtctr r11; bctr  (16 B)
